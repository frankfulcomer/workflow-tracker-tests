name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Fired by workflow-tracker's CI after a successful push to its main,
  # carrying the commit SHA to test in client_payload. See the checkout
  # step below for how that SHA is used.
  repository_dispatch:
    types: [ app-ci-success ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this test suite
        uses: actions/checkout@v5

      # This is a runtime dependency only (something has to be listening on
      # localhost:8080 for a black-box suite to test against) - the test
      # suite itself never imports or builds against the app's source.
      #
      # Dual-trigger behavior: on a normal push/PR run, `ref` evaluates to
      # an empty string, so actions/checkout falls back to its default
      # (the app's main branch). When triggered via repository_dispatch
      # from workflow-tracker's CI, it pins to the exact commit SHA from
      # client_payload.sha, so this suite always tests the revision that
      # actually triggered it - not whatever main has moved to since.
      - name: Check out the app under test
        uses: actions/checkout@v5
        with:
          repository: frankfulcomer/workflow-tracker
          path: workflow-tracker-app
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || '' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Playwright browsers
        run: mvn -B exec:java -e -Dexec.mainClass="com.microsoft.playwright.CLI" -Dexec.args="install --with-deps chromium"

      - name: Build the app under test
        working-directory: workflow-tracker-app
        run: mvn -B -DskipTests package

      - name: Start the app under test
        working-directory: workflow-tracker-app
        run: |
          nohup java -jar target/*.jar > ../app.log 2>&1 &
          echo $! > ../app.pid

      - name: Wait for the app to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/ > /dev/null; then
              echo "App is up after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become ready in time"
          cat app.log
          exit 1

      - name: Run black-box UI tests
        run: mvn -B test -Dbase.url=http://localhost:8080

      - name: Stop the app under test
        if: always()
        run: |
          kill "$(cat app.pid)" 2>/dev/null || true
          pkill -f 'java -jar target/.*\.jar' 2>/dev/null || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Upload app log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-log
          path: app.log
